name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build APK with Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.android
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: glasses-apk:latest
      
      - name: Load Docker image
        run: docker load --input /tmp/image.tar
      
      - name: Extract APK from Docker image
        run: |
          mkdir -p apk-output
          docker run --rm glasses-apk:latest > apk-output/app-debug.apk
          ls -lh apk-output/
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-output/app-debug.apk
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apk-output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
